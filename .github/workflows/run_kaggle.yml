name: Kaggle GPU Video Engine

on:
  schedule:
    - cron: '0 15 * * *' # 15:00 UTC = 8:30 PM IST
  workflow_dispatch:

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kaggle CLI
        run: pip install kaggle

      - name: Run Kaggle GPU with Secrets
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Inject secrets directly into generator.py before pushing to Kaggle
          sed -i "s|PLACEHOLDER_GEMINI|$GEMINI_API_KEY|g" kaggle/generator.py
          sed -i "s|PLACEHOLDER_GH_PAT|$GH_PAT|g" kaggle/generator.py
          sed -i "s|PLACEHOLDER_GITHUB_REPO|$GITHUB_REPO|g" kaggle/generator.py
          
          # Push to Kaggle and run!
          kaggle kernels push -p ./kaggle
